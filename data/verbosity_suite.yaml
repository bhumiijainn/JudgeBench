    input: "Explain the difference between HTTP and HTTPS."
    system_prompt: "Explain clearly and completely for a beginner."
    expected_winner: "B"
    candidate_a:
      output: "HTTP transfers web data without encryption, while HTTPS uses TLS encryption to protect data in transit."
    candidate_b:
      output: "HTTP and HTTPS are protocols used to transfer web data, but HTTPS adds security through TLS encryption. With HTTP, data can be intercepted or modified while traveling between the client and server. HTTPS encrypts the connection and also helps authenticate the server through certificates, making it much safer for passwords, payments, and other sensitive information."

